name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 오픈채팅 URL 등 필수 값이 비어 있으면 여기서 멈춥니다(가짜 링크 배포 방지).
      - run: npm run check:config
      - run: npm run build
      # 개인 도메인을 쓰는 경우 CNAME 파일 생성
      - run: node -e "import('./site.config.mjs').then(({default:c})=>{const h=new URL(c.siteUrl).hostname;if(!h.endsWith('github.io'))require('fs').writeFileSync('dist/CNAME',h)})"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
